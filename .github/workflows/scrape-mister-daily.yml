name: Scrape Mister daily data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write

jobs:
  scrape-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Scrape daily pages
        run: pnpm run scrape:mister:daily
        env:
          MISTER_COMMUNITY_ID: ${{ secrets.MISTER_COMMUNITY_ID }}
          MISTER_STORAGE_STATE_BASE64: ${{ secrets.MISTER_STORAGE_STATE_BASE64 }}
          MISTER_EMAIL: ${{ secrets.MISTER_EMAIL }}
          MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
          MISTER_LINEUP_AWARD_START_ROUND: 3
          MISTER_PLAYER_DETAIL_CONCURRENCY: 8
          MISTER_PLAYER_MOVEMENT_CONCURRENCY: 12
          MISTER_PLAYER_MOVEMENT_LIMIT: 700

      - name: Update LaLiga calendar
        run: pnpm run calendar:laliga

      - name: Build dashboard data
        run: pnpm run build:data

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar datos diarios Mister"
          file_pattern: data/mister/latest/** data/mister/market-history.jsonl data/mister/transfer-history.jsonl data/cerdo/** data/laliga/**
